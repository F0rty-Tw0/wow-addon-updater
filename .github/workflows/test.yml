name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate addons.json
        run: jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$"))' addons.json

      - name: Run bump tests
        run: bash bump.test.sh

      - name: Shellcheck
        run: shellcheck bump.sh bump.test.sh

      - name: Actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint
