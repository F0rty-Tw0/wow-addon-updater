name: Weekly interface bump

on:
  schedule:
    - cron: "0 10 * * 3"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen without pushing anything"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.read.outputs.repos }}
    steps:
      - uses: actions/checkout@v4

      - name: Read addons.json
        id: read
        run: echo "repos=$(jq -c . addons.json)" >> "$GITHUB_OUTPUT"

  bump:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bump ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.ADDON_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          REPO: ${{ matrix.repo }}
          RESULT_FILE: result-${{ strategy.job-index }}.json
        run: |
          set +e
          line=$(bash bump.sh "$REPO")
          status=$?
          echo "${REPO}: ${line:-error: no result line}" >> "$GITHUB_STEP_SUMMARY"
          echo "$line"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: result-${{ strategy.job-index }}.json
          if-no-files-found: ignore

  report:
    needs: [list, bump]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash report.sh --publish addons.json results | tee -a "$GITHUB_STEP_SUMMARY"
